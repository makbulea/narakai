services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: code-intelligence-rag-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: code_intelligence_rag
    ports:
      - "5433:5432"
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d code_intelligence_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rag_postgres_data:
